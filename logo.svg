<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 48" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0EDD8"/>
      <stop offset="100%" stop-color="#B8B5A2"/>
    </linearGradient>
  </defs>

  <!-- Premium geometric mark — abstract ascending inbox -->
  <g transform="translate(0, 3)">
    <!-- Outer diamond/envelope form -->
    <path d="M18 2 L34 16 L34 34 L18 42 L2 34 L2 16 Z" stroke="url(#logoGrad)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    <!-- Inner ascending chevrons — representing scale/growth -->
    <path d="M10 28 L18 22 L26 28" stroke="#DEDBC8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 22 L18 16 L26 22" stroke="#DEDBC8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
    <path d="M10 16 L18 10 L26 16" stroke="#DEDBC8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
  </g>

  <!-- "INBOX" — bold weight, tight tracking -->
  <text x="48" y="23" font-family="'Almarai', 'Helvetica Neue', sans-serif" font-weight="800" font-size="16.5" fill="#DEDBC8" letter-spacing="3.5">INBOX</text>

  <!-- "SCALING" — light weight, wider tracking for contrast -->
  <text x="48" y="41" font-family="'Almarai', 'Helvetica Neue', sans-serif" font-weight="300" font-size="16.5" fill="#DEDBC8" letter-spacing="6" opacity="0.75">SCALING</text>
</svg>
